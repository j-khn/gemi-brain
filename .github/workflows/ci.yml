name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, macos]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          chmod +x scripts/ci_setup_venv.sh scripts/select_python.sh scripts/dlib_bin_version.sh
          bash scripts/ci_setup_venv.sh
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Run unit tests
        run: python -m pytest tests/ -v
        shell: bash

  mutation-testing:
    needs: test
    if: github.event_name == 'push' && github.ref_name == 'master'
    runs-on: [self-hosted, macos]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and mutmut
        run: |
          chmod +x scripts/ci_setup_venv.sh scripts/select_python.sh scripts/dlib_bin_version.sh
          bash scripts/ci_setup_venv.sh
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Run mutation testing
        run: |
          python -m pip install mutmut
          mutmut run
          mutmut export-cicd-stats
        shell: bash

  deploy:
    name: Deploy tested commit
    needs: [test, mutation-testing]
    if: github.event_name == 'push' && github.ref_name == 'master'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
