name: Deploy to Self-hosted Runner

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'develop' || github.event.workflow_run.head_branch == 'main') }}
    name: Deploy on self-hosted macOS runner
    runs-on: self-hosted
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies using runner Python
        run: |
          python3 --version
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
        shell: bash

      - name: Configure environment
        run: |
          echo "HOST=${{ secrets.APP_HOST }}" > .env
          echo "PORT=${{ secrets.APP_PORT }}" >> .env
          echo "OLLAMA_URL=${{ secrets.OLLAMA_URL }}" >> .env
          echo "APP_ENV=production" >> .env

      - name: Restart Gemi Brain server
        run: |
          chmod +x scripts/restart_server.sh
          ./scripts/restart_server.sh
