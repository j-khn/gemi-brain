name: Deploy to Self-hosted Runner

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch: # manual run available from the Actions page

jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'develop' || github.event.workflow_run.head_branch == 'main')) || github.event_name == 'workflow_dispatch' }}
    name: Deploy on self-hosted macOS runner
    runs-on: [self-hosted, macos]
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies using runner Python
        run: |
          brew install cmake pkg-config libpng
          LIBPNG_PREFIX="$(brew --prefix libpng)"
          export PKG_CONFIG_PATH="${LIBPNG_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export C_INCLUDE_PATH="${LIBPNG_PREFIX}/include:${C_INCLUDE_PATH:-}"
          export LIBRARY_PATH="${LIBPNG_PREFIX}/lib:${LIBRARY_PATH:-}"
          export CPPFLAGS="-I${LIBPNG_PREFIX}/include ${CPPFLAGS:-}"
          export LDFLAGS="-L${LIBPNG_PREFIX}/lib ${LDFLAGS:-}"
          {
            echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}"
            echo "C_INCLUDE_PATH=${C_INCLUDE_PATH}"
            echo "LIBRARY_PATH=${LIBRARY_PATH}"
            echo "CPPFLAGS=${CPPFLAGS}"
            echo "LDFLAGS=${LDFLAGS}"
          } >> "$GITHUB_ENV"
          if command -v python3 >/dev/null 2>&1; then
            PYTHON=python3
          elif command -v python >/dev/null 2>&1; then
            PYTHON=python
          else
            echo "No usable Python interpreter found on runner" >&2
            exit 1
          fi
          $PYTHON --version
          $PYTHON -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir -r requirements.txt
        shell: bash

      - name: Configure environment
        run: |
          HOST="${{ vars.APP_HOST }}"
          PORT="${{ vars.APP_PORT }}"
          test -n "$HOST" || HOST="0.0.0.0"
          test -n "$PORT" || PORT="8765"
          echo "HOST=$HOST" > .env
          echo "PORT=$PORT" >> .env
          echo "OLLAMA_URL=${{ vars.OLLAMA_URL }}" >> .env
          echo "APP_ENV=production" >> .env

      - name: Restart Gemi Brain server
        run: |
          chmod +x scripts/restart_server.sh
          export PYTHON_BIN="${PWD}/.venv/bin/python"
          export PATH="${PWD}/.venv/bin:${PATH}"
          ./scripts/restart_server.sh

      - name: Verify deployed service
        run: |
          PORT="${{ vars.APP_PORT }}"
          test -n "$PORT" || PORT="8765"
          echo "Checking local deployment on port ${PORT}..."
          for attempt in {1..15}; do
            if curl --fail --silent --show-error "http://127.0.0.1:${PORT}/api/health" >/dev/null; then
              echo "Deployment check passed."
              exit 0
            fi
            sleep 1
          done
          echo "Deployment check failed. Dumping logs..."
          if [ -f logs/gemi_brain.log ]; then
            tail -n 80 logs/gemi_brain.log
          fi
          exit 1
        shell: bash
