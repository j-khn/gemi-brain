name: Deploy to Self-hosted Runner

on:
  workflow_call:
  workflow_dispatch: # manual run available from the Actions page

jobs:
  deploy:
    name: Deploy on self-hosted macOS runner
    runs-on: [self-hosted, macos]
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install dependencies using runner Python
        run: |
          ARCH="$(uname -m)"
          case "$ARCH" in
            arm64|x86_64)
              echo "Using supported macOS architecture: ${ARCH}"
              ;;
            *)
              echo "Unsupported macOS architecture for dlib-bin: ${ARCH}" >&2
              exit 1
              ;;
          esac
          DEPLOY_DIR="${HOME}/.gemi-brain"
          mkdir -p "${DEPLOY_DIR}"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude '.env' \
            --exclude 'logs/' \
            --exclude '*.db' \
            "${GITHUB_WORKSPACE}/" "${DEPLOY_DIR}/"
          echo "DEPLOY_DIR=${DEPLOY_DIR}" >> "$GITHUB_ENV"
          if command -v python3 >/dev/null 2>&1; then
            PYTHON=python3
          elif command -v python >/dev/null 2>&1; then
            PYTHON=python
          else
            echo "No usable Python interpreter found on runner" >&2
            exit 1
          fi
          $PYTHON --version
          $PYTHON -m venv "${DEPLOY_DIR}/.venv"
          source "${DEPLOY_DIR}/.venv/bin/activate"
          python -m pip install --upgrade pip setuptools wheel
          python - "${DEPLOY_DIR}/requirements.txt" <<'PY'
          from pathlib import Path
          import sys
          requirements = Path(sys.argv[1]).read_text().splitlines()
          Path("/tmp/gemi-requirements.txt").write_text(
              "\n".join(line for line in requirements
                        if line.strip().lower() != "face_recognition") + "\n"
          )
          PY
          python -m pip install --no-cache-dir -r /tmp/gemi-requirements.txt
          python -m pip install --no-cache-dir dlib-bin==19.24.6
          python -m pip install --no-cache-dir --no-deps face-recognition==1.3.0
          python -m pip install --no-cache-dir face-recognition-models==0.3.0
          python -c "import dlib, face_recognition; print('face recognition dependencies ready')"
        shell: bash

      - name: Configure environment
        run: |
          HOST="${{ vars.APP_HOST }}"
          PORT="${{ vars.APP_PORT }}"
          OLLAMA_URL="${{ vars.OLLAMA_URL }}"
          test -n "$HOST" || HOST="0.0.0.0"
          test -n "$PORT" || PORT="8765"
          test -n "$OLLAMA_URL" || OLLAMA_URL="http://localhost:11434/api/generate"
          echo "HOST=$HOST" > "${DEPLOY_DIR}/.env"
          echo "PORT=$PORT" >> "${DEPLOY_DIR}/.env"
          echo "OLLAMA_URL=$OLLAMA_URL" >> "${DEPLOY_DIR}/.env"
          echo "APP_ENV=production" >> "${DEPLOY_DIR}/.env"

      - name: Restart Gemi Brain server
        run: |
          cd "${DEPLOY_DIR}"
          chmod +x scripts/restart_server.sh
          export PYTHON_BIN="${DEPLOY_DIR}/.venv/bin/python"
          export PATH="${DEPLOY_DIR}/.venv/bin:${PATH}"
          ./scripts/restart_server.sh

      - name: Verify deployed service
        run: |
          PORT="${{ vars.APP_PORT }}"
          test -n "$PORT" || PORT="8765"
          echo "Checking local deployment on port ${PORT}..."
          for attempt in {1..60}; do
            if curl --fail --silent --show-error "http://127.0.0.1:${PORT}/api/health" >/dev/null; then
              echo "Deployment check passed."
              exit 0
            fi
            sleep 1
          done
          echo "Deployment check failed. Dumping logs..."
          if [ -f "${DEPLOY_DIR}/logs/gemi_brain.log" ]; then
            tail -n 80 "${DEPLOY_DIR}/logs/gemi_brain.log"
          fi
          exit 1
        shell: bash
